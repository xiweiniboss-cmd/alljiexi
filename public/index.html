<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>解析总入口 · 粘贴链接自动识别平台</title>
<meta name="description" content="粘贴抖音、快手、小红书、B站、YouTube、TikTok 的分享文字或链接，自动识别平台，跳到对应的无水印解析站。">
<meta name="theme-color" content="#181410" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f4eedc" media="(prefers-color-scheme: light)">
<meta name="referrer" content="no-referrer">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23141415'/%3E%3Cpath d='M14 24V14h10M40 14h10v10M50 40v10H40M24 50H14V40' fill='none' stroke='%23ededed' stroke-width='4'/%3E%3Cpath d='M27 22v20l16-10z' fill='%23ededed'/%3E%3C/svg%3E">
<meta property="og:type" content="website">
<meta property="og:title" content="解析总入口">
<meta property="og:description" content="粘贴任意平台的分享文字，自动识别并跳到对应的无水印解析站。">
<script src="theme.js"></script>
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="wrap">
  <header class="top">
    <svg class="mark" viewBox="0 0 28 28" width="28" height="28" aria-hidden="true">
      <path d="M5 10V5h5M18 5h5v5M23 18v5h-5M10 23H5v-5" fill="none" stroke="currentColor" stroke-width="1.5"/>
      <path d="M12 10.2v7.6l6.4-3.8-6.4-3.8z" fill="currentColor"/>
    </svg>
    <div class="brand">
      <div class="brand-name">解析总入口</div>
      <div class="brand-sub">无水印下载</div>
    </div>
    <button type="button" class="theme-btn" id="themeBtn" aria-label="切换浅色 / 深色">
      <svg class="i-sun" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      <svg class="i-moon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
    </button>
  </header>

  <main>
    <section class="hero">
      <h1>一个框，<br>解析所有平台</h1>
      <p class="sub">把 App 里复制的分享文字整段粘进来，不用挑链接。认出是哪个平台后，会带着链接跳到对应的解析站，你在那边点一下解析就行。</p>

      <form class="card work" id="form" autocomplete="off" novalidate>
        <label class="field-label" for="input">分享文字或链接</label>
        <textarea id="input" rows="4" maxlength="5000" spellcheck="false" placeholder="例如：7.43 复制打开抖音，看看【某某的作品】… https://v.douyin.com/xxxxxx/"></textarea>
        <div class="row">
          <button type="button" class="btn ghost" id="pasteBtn">粘贴</button>
          <button type="button" class="btn ghost" id="clearBtn">清空</button>
          <button type="submit" class="btn primary" id="goBtn">识别并前往</button>
        </div>
        <div class="result" id="result" role="status" aria-live="polite" hidden></div>
      </form>
    </section>

    <section class="sites">
      <h2>全部解析站</h2>
      <ul class="grid" id="grid"></ul>
    </section>

    <section class="notes">
      <h2>说明</h2>
      <ul>
        <li>识别只在你的浏览器里完成，本页不收集、不上传你粘贴的内容，也没有统计代码。</li>
        <li>链接会通过网址的 <code>#</code> 部分带过去，不经过任何服务器。</li>
        <li>只支持公开内容。私密、仅好友可见、已删除的作品解析不出来。</li>
        <li>某个站解析失败，可以在那个站底部点「反馈」告诉我们。</li>
      </ul>
    </section>
  </main>

  <footer class="foot">仅供个人保存自己有权使用的内容，请尊重原作者版权。</footer>
</div>
<noscript><p class="noscript">需要开启 JavaScript 才能自动识别。也可以直接点上面的站点卡片。</p></noscript>
<script type="module" src="app.mjs"></script>
</body>
</html>
